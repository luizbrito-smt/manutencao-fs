<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Manutenção — Check List de Inspeções</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="shortcut icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#303338;
  --bg-elev:#3a3d43;
  --bg-elev2:#45484f;
  --bg-elev3:#50535b;
  --border:#5c5f68;
  --fg:#ffffff;
  --muted:#c2c4cb;
  --ok:#4ade80;
  --bad:#f87171;
  --warn:#facc15;
  --accent:#e8e9ec;
  --accent-solid:#ffffff;
  --accent-solid-text:#101114;
  --radius:12px;
  --mono: 'SF Mono', 'Consolas', monospace;
}
html[data-theme="light"]{
  --bg:#f0f1f3;
  --bg-elev:#ffffff;
  --bg-elev2:#eef0f3;
  --bg-elev3:#e2e4e9;
  --border:#d6d9de;
  --fg:#1b1d21;
  --muted:#6b6e77;
  --ok:#159a49;
  --bad:#dc2626;
  --warn:#b45309;
  --accent:#1b1d21;
  --accent-solid:#1b1d21;
  --accent-solid-text:#ffffff;
}
html[data-theme="light"] body{background:var(--bg);}
html{transition:background-color .2s;}
body{transition:background-color .2s, color .2s;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1100px;margin:0 auto;padding-bottom:90px;}
a{color:inherit;}

/* Header */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:18px 52px 15px 14px;
}
.theme-toggle{
  position:absolute;top:14px;right:14px;
  width:34px;height:34px;border-radius:50%;
  background:var(--bg-elev2);border:1px solid var(--border);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;color:var(--fg);
}
.theme-toggle:active{background:var(--bg-elev3);}
.topbar-brand{display:flex;align-items:center;gap:12px;}
.brand-logo{height:36px;width:auto;border-radius:7px;flex-shrink:0;display:block;}
.topbar-titles{min-width:0;}
.topbar h1{
  font-size:18px;letter-spacing:0.005em;font-weight:800;margin:0 0 3px;
  text-transform:uppercase;color:var(--fg);line-height:1.25;
}
.topbar .sub{font-size:13px;color:var(--muted);}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.btn-back{
  background:var(--bg-elev2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;
}
.btn-back:active{background:var(--bg-elev3);}

/* Bottom nav */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--bg);
  border-top:1px solid var(--border);
  display:flex;justify-content:center;
}
.bottomnav-inner{max-width:1100px;width:100%;display:flex;}
.navbtn{
  flex:1;background:none;border:none;color:var(--muted);
  padding:10px 2px 12px;font-size:10.5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  letter-spacing:0.005em;font-weight:600;white-space:nowrap;
}
.navbtn .ic{font-size:20px;}
.navbtn.active{color:var(--fg);}
.navbtn.active .ic{filter:drop-shadow(0 0 6px rgba(255,255,255,0.25));}

/* Generic layout helpers */
.page{padding:18px 14px 20px;}
.section-title{font-size:14px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin:22px 0 10px;font-weight:700;}
.section-title:first-child{margin-top:4px;}
.card{
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;
}
.card-tap{cursor:pointer;transition:background .12s;}
.card-tap:active{background:var(--bg-elev2);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-list{display:flex;flex-direction:column;gap:10px;}

.list-item{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 22px;cursor:pointer;width:100%;
}
.list-item:active{background:var(--bg-elev2);}
.list-item .li-main{display:flex;flex-direction:column;gap:6px;min-width:0;}
.list-item .li-title{font-size:21px;font-weight:700;color:var(--fg);}
.list-item .li-sub{font-size:14.5px;color:var(--muted);}
.chev{color:var(--muted);font-size:26px;flex-shrink:0;}
.grid-list{gap:14px;}

/* Badges */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;letter-spacing:0.02em;white-space:nowrap;
}
.badge-ok{background:rgba(74,222,128,0.12);color:var(--ok);}
.badge-bad{background:rgba(248,113,113,0.12);color:var(--bad);}
.badge-warn{background:rgba(250,204,21,0.12);color:var(--warn);}
.badge-neutral{background:var(--bg-elev3);color:var(--muted);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--accent-solid);color:var(--accent-solid-text);border:none;border-radius:9px;
  padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;
}
.btn:active{opacity:0.85;}
.btn-secondary{background:var(--bg-elev3);color:var(--fg);border:1px solid var(--border);}
.btn-danger{background:rgba(248,113,113,0.14);color:var(--bad);border:1px solid rgba(248,113,113,0.3);}
.btn-outline{background:none;color:var(--fg);border:1px solid var(--border);}
.btn-sm{padding:8px 12px;font-size:12.5px;width:auto;}
.btn-row{display:flex;gap:10px;margin-top:14px;}
.fab{
  position:fixed;right:20px;bottom:88px;z-index:25;
  width:52px;height:52px;border-radius:50%;background:var(--accent-solid);color:var(--accent-solid-text);
  border:none;font-size:26px;font-weight:400;cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;
}

/* Search */
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--bg-elev);border:1px solid var(--border);
  border-radius:9px;padding:10px 12px;margin-bottom:14px;
}
.search-box input{
  background:none;border:none;outline:none;color:var(--fg);font-size:14.5px;width:100%;
}
.search-box input::placeholder{color:var(--muted);}
.search-box .ic{color:var(--muted);}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em;font-weight:600;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;
  padding:11px 12px;color:var(--fg);font-size:14.5px;outline:none;font-family:inherit;
}
.field textarea{resize:vertical;min-height:64px;}
.field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239a9ca3'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#6b6d75;}

/* Yes/No selector */
.yn-row{display:flex;gap:10px;flex-wrap:wrap;}
.yn-opt{
  flex:1;min-width:90px;text-align:center;padding:16px 10px;border-radius:9px;
  border:1px solid var(--border);background:var(--bg-elev2);cursor:pointer;
  font-size:16px;font-weight:700;color:var(--muted);user-select:none;
}
.yn-opt.yn-sim{background:rgba(74,222,128,0.16);border-color:rgba(74,222,128,0.4);color:var(--ok);}
.yn-opt.yn-nao{background:rgba(248,113,113,0.16);border-color:rgba(248,113,113,0.4);color:var(--bad);}
.yn-opt.yn-nao_possui{background:rgba(250,204,21,0.16);border-color:rgba(250,204,21,0.4);color:var(--warn);}
.yn-opt.sel-sim{background:var(--ok);border-color:var(--ok);color:#ffffff;}
.yn-opt.sel-nao{background:var(--bad);border-color:var(--bad);color:#ffffff;}
.yn-opt.sel-nao_possui{background:var(--warn);border-color:var(--warn);color:#1b1d21;}

.q-block{border-top:1px solid var(--border);padding:18px 0;}
.q-block:first-child{border-top:none;padding-top:2px;}
.q-text{font-size:16.5px;font-weight:700;margin-bottom:12px;line-height:1.4;color:var(--fg);}
.q-obs{margin-top:10px;display:none;}
.q-obs.show{display:block;}
.q-obs textarea{width:100%;background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--fg);font-size:13.5px;min-height:56px;font-family:inherit;}
.q-obs label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;}

.grupo-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.grupo-head{padding:18px 18px;background:var(--bg-elev2);display:flex;justify-content:center;align-items:center;}
.grupo-head .gname{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;color:var(--fg);text-align:center;}
.grupo-body{padding:4px 18px 10px;}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ic{font-size:34px;margin-bottom:10px;}
.empty p{font-size:13.5px;margin:4px 0;}

/* Images */
.img-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;}
.img-thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg-elev2);}
.img-thumb img{width:100%;height:100%;object-fit:cover;}
.img-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;}
.img-thumb img{cursor:zoom-in;}
.evidence-viewer{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:28px;backdrop-filter:blur(5px);}
.evidence-viewer-box{position:relative;width:min(96vw,1280px);height:min(92vh,900px);display:flex;align-items:center;justify-content:center;}
.evidence-viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;box-shadow:0 25px 70px rgba(0,0,0,.55);background:#0b1118;}
.evidence-viewer-close{position:absolute;top:-10px;right:-10px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(15,23,42,.92);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.35);}
.evidence-viewer-close:hover{background:#ef4444;}
.evidence-viewer-caption{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);color:#fff;background:rgba(15,23,42,.88);padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;border:1px solid rgba(255,255,255,.12);}
@media(max-width:640px){.evidence-viewer{padding:14px}.evidence-viewer-box{width:100%;height:88vh}.evidence-viewer-close{top:4px;right:4px}.evidence-viewer-caption{bottom:4px}}
.img-add{aspect-ratio:1;border-radius:8px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;cursor:pointer;background:var(--bg-elev2);}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat-card .num{font-size:26px;font-weight:800;color:var(--fg);}
.stat-card .lbl{font-size:11.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.03em;}
.bar-row{margin-bottom:14px;}
.bar-row .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.bar-row .bar-top .nm{font-weight:600;color:var(--fg);}
.bar-row .bar-top .pct{color:var(--muted);font-family:var(--mono);}
.bar-track{height:8px;border-radius:5px;background:var(--bg-elev3);overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}

/* Kanban */
.kanban-col{margin-bottom:22px;}
.kanban-col-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.kanban-col-head .dot{width:9px;height:9px;border-radius:50%;}
.kanban-col-head h3{font-size:12.5px;text-transform:uppercase;letter-spacing:0.05em;margin:0;color:var(--fg);font-weight:700;}
.kanban-col-head .count{color:var(--muted);font-size:12px;}
.pend-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:8px;}
.pend-card .pt{font-size:13.5px;font-weight:600;color:var(--fg);margin-bottom:3px;}
.pend-card .pd{font-size:12px;color:var(--muted);margin-bottom:8px;}
.pend-status-row{display:flex;gap:6px;flex-wrap:wrap;}

/* Chamados */
.chamado-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chamado-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.chamado-num{font-size:16px;font-weight:700;color:var(--fg);}
.chamado-meta{font-size:12.5px;color:var(--muted);margin-top:4px;}
.chamado-status-row{display:flex;align-items:center;gap:8px;margin-top:12px;}
.chamado-status-row .status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.chamado-status-row select{
  flex:1;background:var(--bg-elev2);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;color:var(--fg);font-size:13px;outline:none;font-family:inherit;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239a9ca3'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.chamado-del{
  background:none;border:1px solid var(--border);border-radius:8px;color:var(--muted);
  font-size:14px;padding:8px 10px;cursor:pointer;flex-shrink:0;
}
.chamado-del:active{background:var(--bg-elev3);}
.chip{font-size:11px;padding:5px 9px;border-radius:6px;background:var(--bg-elev2);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
.chip.active{background:var(--accent-solid);color:var(--accent-solid-text);border-color:var(--accent-solid);font-weight:700;}

/* Modal / overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--bg-elev);border-radius:16px 16px 0 0;max-width:900px;width:100%;max-height:88vh;overflow-y:auto;padding:20px 18px 26px;border-top:1px solid var(--border);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:var(--accent-solid);color:var(--accent-solid-text);padding:11px 20px;border-radius:30px;
  font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.4);
  opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.divider{height:1px;background:var(--border);margin:14px 0;}
.small-muted{font-size:11.5px;color:var(--muted);}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pill{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--bg-elev2);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
.pill.active{background:var(--accent-solid);color:var(--accent-solid-text);border-color:var(--accent-solid);}

/* Form pages stay comfortably narrow on big screens */
.page-form{max-width:720px;margin:0 auto;}

/* ============ RESPONSIVE: tablet ============ */
@media (min-width:680px){
  .page{padding:22px 24px 24px;}
  .topbar{padding:20px 62px 16px 24px;}
  .theme-toggle{right:24px;top:18px;}
  .brand-logo{height:48px;}
  .grid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;}
  .list-item{width:auto;}
  .stat-grid{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  .kanban-board{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .kanban-col{margin-bottom:0;}
  .img-grid{grid-template-columns:repeat(6,1fr);max-width:520px;}
  .btn-row{max-width:720px;}
}

/* ============ RESPONSIVE: desktop ============ */
@media (min-width:1024px){
  .kanban-board{grid-template-columns:repeat(4,1fr);}
  .grid-list{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
  .bottomnav-inner{justify-content:center;gap:28px;}
  .navbtn{flex:0 1 130px;}
}
@media (min-width:1160px){
  .fab{right:calc(50% - 550px + 20px);}
}


/* ===== Visual refresh 2026 ===== */
:root{
  --brand:#22c55e;
  --brand-strong:#16a34a;
  --panel:#111b27;
  --panel-2:#172332;
  --panel-3:#1d2b3c;
  --line:rgba(148,163,184,.22);
  --shadow:0 14px 32px rgba(0,0,0,.24);
}
body{background:radial-gradient(circle at 15% 5%,rgba(34,197,94,.07),transparent 24%),linear-gradient(180deg,#0c1622 0%,#0f1a27 100%);}
#app{max-width:1440px;padding-bottom:100px;}
.topbar{
  position:relative;top:auto;padding:18px 24px;background:linear-gradient(135deg,#0d1825 0%,#111f2d 100%);
  border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.16);
}
.topbar-brand{gap:16px}.brand-logo{height:52px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.topbar h1{font-size:24px;letter-spacing:.02em}.topbar .sub{font-size:14px;color:#a8b3c3}
.theme-toggle{top:22px;right:24px;width:42px;height:42px;background:#182536;border-color:var(--line);box-shadow:0 6px 16px rgba(0,0,0,.18)}

.home-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.14));pointer-events:none}

// ================= FIREBASE + STORAGE COMPARTILHADO =================
var firebaseDb = null;
var firebaseOnline = false;
var firebaseListenersStarted = false;
var firebaseRefs = [];
var authReady = false;

function firebaseConfigOk(){
  var c = window.FIREBASE_CONFIG || {};
  return !!(c.apiKey && c.projectId && c.databaseURL && String(c.apiKey).indexOf('COLE_') !== 0);
}

function initFirebase(){
  if(!firebaseConfigOk() || !window.firebase) return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    firebaseDb = firebase.database();
    firebaseOnline = true;
    return true;
  }catch(e){
    console.error('Firebase init failed', e);
    firebaseDb = null;
    firebaseOnline = false;
    return false;
  }
}

async function localGet(key){
  try{
    if(window.storage && window.storage.get){
      var r = await window.storage.get(key,false);
      if(r && r.value) return JSON.parse(r.value);
    }
  }catch(e){}
  try{
    var raw = localStorage.getItem('manutencao_'+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

async function localSet(key,val){
  try{ localStorage.setItem('manutencao_'+key, JSON.stringify(val)); }catch(e){}
  return true;
}

async function storageGet(key){
  if(key === STORE_THEME) return localGet(key);
  if(!firebase.auth().currentUser) throw new Error('Sessão não autenticada');
  // Nunca sobrescrever a base remota com cache local ao encontrar um nó vazio.
  var snap = await firebaseDb.ref('appData/'+key).once('value');
  return snap.val();
}

async function storageSet(key,val){
  if(key === STORE_THEME) return localSet(key,val);
  if(!firebaseDb || !firebase.auth().currentUser){toast('Faça login para salvar alterações');return false;}
  try{
    await firebaseDb.ref('appData/'+key).set(val);
    await localSet(key,val);
    return true;
  }catch(e){console.error('Firebase write failed',key,e);toast('Erro ao salvar no Firebase. Verifique sua conexão e permissões.');return false;}
}

function stopFirebaseListeners(){
  firebaseRefs.forEach(function(ref){ref.off('value');});
  firebaseRefs=[];firebaseListenersStarted=false;
}

function startFirebaseListeners(){
  if(!firebaseDb || firebaseListenersStarted) return;
  firebaseListenersStarted = true;
  var map = {};
  map[STORE_EQUIP] = 'equipamentos';
  map[STORE_INSP] = 'inspecoes';
  map[STORE_PEND] = 'pendencias';
  map[STORE_CHAMADOS] = 'chamados';
  Object.keys(map).forEach(function(key){
    var ref = firebaseDb.ref('appData/'+key);
    firebaseRefs.push(ref);
    ref.on('value', function(snap){
      var val = snap.val();
      if(val === null || val === undefined) val = [];
      state[map[key]] = val;
      localSet(key,val);
      if(state.loaded) render();
    }, function(err){
      console.error('Firebase listener failed', key, err);
    });
  });
}

async function loadAll(){
  var eq = await storageGet(STORE_EQUIP);
  var insp = await storageGet(STORE_INSP);
  var pend = await storageGet(STORE_PEND);
  var cham = await storageGet(STORE_CHAMADOS);
  var theme = await storageGet(STORE_THEME);
  state.equipamentos = eq || [];
  state.inspecoes = insp || [];
  state.pendencias = pend || [];
  state.chamados = cham || [];
  state.theme = (theme && theme.theme) || 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  state.loaded = true;
  startFirebaseListeners();
}

async function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', state.theme);
  await storageSet(STORE_THEME, {theme: state.theme});
  render();
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateOnly(ds){
  if(!ds) return '—';
  var parts = ds.split('-');
  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return ds;
}

// ================= ROOT RENDER =================
function setView(v){
  state.view = v;
  state.nav = [];
  render();
}

function render(){
  var app = document.getElementById('app');
  var html = '';
  if(!state.loaded){
    html = '<div class="empty"><div class="ic">⏳</div><p>Carregando...</p></div>';
    app.innerHTML = html;
    return;
  }
  if(state.view === 'checklist') html = renderChecklistRoute();
  else if(state.view === 'equipamentos') html = renderEquipamentosRoute();
  else if(state.view === 'historico') html = renderHistoricoRoute();
  else if(state.view === 'dashboard') html = renderDashboard();
  else if(state.view === 'apresentacao') html = renderPresentation();
  else if(state.view === 'pendencias') html = renderPendencias();
  else if(state.view === 'chamados') html = renderChamadosRoute();

  if(state.view !== 'apresentacao') html += renderBottomNav();
  app.innerHTML = html;
  afterRender();
}

function renderBottomNav(){
  var items = [
    {id:'checklist', ic:'✅', label:'Checklist'},
    {id:'equipamentos', ic:'🗄️', label:'Equipamentos'},
    {id:'historico', ic:'🕓', label:'Histórico'},
    {id:'dashboard', ic:'📊', label:'Dashboard'},
    {id:'apresentacao', ic:'📺', label:'Apresentação'},
    {id:'pendencias', ic:'📌', label:'Pendências'},
  ];
  var btns = items.map(function(it){
    return '<button class="navbtn '+(state.view===it.id?'active':'')+'" data-nav="'+it.id+'"><span class="ic">'+it.ic+'</span>'+it.label+'</button>';
  }).join('');
  return '<div class="bottomnav"><div class="bottomnav-inner">'+btns+'</div></div>';
}

function afterRender(){
  document.querySelectorAll('[data-nav]').forEach(function(b){
    b.addEventListener('click', function(){ setView(b.getAttribute('data-nav')); });
  });
  bindPageEvents();
  var areaSearch = document.getElementById('areaSearch');
  if(areaSearch){
    areaSearch.addEventListener('input', function(){
      var term = areaSearch.value.trim().toLowerCase();
      document.querySelectorAll('[data-area-name]').forEach(function(card){
        card.style.display = !term || card.getAttribute('data-area-name').indexOf(term)>=0 ? '' : 'none';
      });
    });
  }
}

function renderChecklistRoute(){
  var depth = state.nav.length;
  if(depth === 0) return renderAreaList();
  if(depth === 1) return renderUnidadeList();
  if(depth === 2) return renderChecklistForm();

function topbar(title, sub, showBack){
  var back = showBack ? '<div class="back-row"><button class="btn-back" id="btnBack">← Voltar</button></div>' : '';
  var themeIcon = state.theme==='light' ? '🌙' : '☀️';
  var themeBtn = '<button class="theme-toggle" id="themeToggle" title="Alternar tema">'+themeIcon+'</button>';
  var now = new Date();
  var dateTxt = now.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return '<div class="topbar">'+back+
    '<div class="topbar-brand"><img src="'+LOGO_SRC+'" class="brand-logo" alt="Logo"><div class="topbar-titles"><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div></div>'+
    '<div class="topbar-actions"><div class="topbar-date">📅 <span>'+dateTxt+'</span></div><div class="user-chip"><div class="avatar">LB</div><div><b>Luiz Brito</b><small>Administrador</small></div></div></div>'+themeBtn+
  '</div>';
}

  };
  var totalItens = AREAS.reduce(function(s,a){ return s+a.unidades.length; },0);

function computeInspecaoStats(unidade, respostas){
  var total=0, bad=0, answered=0;
  unidade.grupos.forEach(function(g){
    g.perguntas.forEach(function(p){
      if(p.bad===null) return;
      total++;
      var r = respostas[g.id][p.id];
      if(r.resp) answered++;
      if(r.resp === p.bad) bad++;
    });
  });
  var conformidade = total>0 ? Math.round(((total-bad)/total)*100) : 100;
  return {total:total, bad:bad, answered:answered, conformidade:conformidade};
}

async function salvarInspecao(){
  var area = AREAS.find(function(a){return a.id===state.currentChecklist.areaId;});
  var unidade = area.unidades.find(function(u){return u.id===state.currentChecklist.unidadeId;});
  var stats = computeInspecaoStats(unidade, state.currentChecklist.respostas);

  var inspecao = {
    id: uid(),
    areaId: area.id, areaNome: area.nome,
    unidadeId: unidade.id, unidadeNome: unidade.nome,
    data: new Date().toISOString(),
    respostas: state.currentChecklist.respostas,
    inspetorObs: state.currentChecklist.inspetorObs || '',
    conformidade: stats.conformidade,
    problemas: stats.bad,
    totalPerguntas: stats.total,
  };
  state.inspecoes.unshift(inspecao);
  await storageSet(STORE_INSP, state.inspecoes);

  // Auto-gerar pendências para respostas problemáticas com observação
  var novasPend = [];
  unidade.grupos.forEach(function(g){
    g.perguntas.forEach(function(p){
      var r = state.currentChecklist.respostas[g.id][p.id];
      if(p.bad !== null && r.resp === p.bad){
        novasPend.push({
          id: uid(),
          titulo: g.nome+' — '+p.texto,
          descricao: r.obs || '(sem observação registrada)',
          areaNome: area.nome, unidadeNome: unidade.nome,
          status: 'aberto',
          origemInspecaoId: inspecao.id,
          criadoEm: new Date().toISOString(),
        });
      }
    });
  });
  if(novasPend.length){
    state.pendencias = novasPend.concat(state.pendencias);
    await storageSet(STORE_PEND, state.pendencias);
  }

  state.currentChecklist = null;
  toast('Inspeção salva' + (novasPend.length? ' · '+novasPend.length+' pendência(s) criada(s)' : ''));
  state.nav = [];
  render();
}

function compressImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = 900;
      var scale = Math.min(1, maxW/img.width);
      var canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.72));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function openEvidenceViewer(src, index){
  var oldViewer = document.querySelector('.evidence-viewer');

  wrap.setAttribute('role','dialog');
  wrap.setAttribute('aria-modal','true');
  wrap.innerHTML = '<div class="evidence-viewer-box"><img src="'+src+'" alt="Evidência ampliada"><button class="evidence-viewer-close" type="button" aria-label="Fechar">×</button><div class="evidence-viewer-caption">Evidência '+(index+1)+' · clique fora para fechar</div></div>';
  document.body.appendChild(wrap);
  var close = function(){
    wrap.remove();
    document.removeEventListener('keydown', onKey);
  };
  var onKey = function(e){ if(e.key==='Escape') close(); };
  wrap.querySelector('.evidence-viewer-close').addEventListener('click', close);
  wrap.addEventListener('click', function(e){ if(e.target===wrap) close(); });
  document.addEventListener('keydown', onKey);
}

// ================= MODO APRESENTACAO / TV =================
function renderPresentation(){
  var total=state.inspecoes.length;
  var totalEquip=state.equipamentos.length;
  var abertas=state.pendencias.filter(function(p){return p.status==='aberto';}).length;
  var andamento=state.pendencias.filter(function(p){return p.status==='andamento';}).length;
  var totalPend=abertas+andamento;
  var mediaConf=total?Math.round(state.inspecoes.reduce(function(s,i){return s+(Number(i.conformidade)||0);},0)/total):0;
  var naoConformes=state.inspecoes.filter(function(i){return (Number(i.conformidade)||0)<90;}).length;

  var porArea={};
  AREAS.forEach(function(a){porArea[a.nome]={conf:[],problemas:0};});
  state.inspecoes.forEach(function(i){
    if(!porArea[i.areaNome]) porArea[i.areaNome]={conf:[],problemas:0};
    porArea[i.areaNome].conf.push(Number(i.conformidade)||0);
    porArea[i.areaNome].problemas+=Number(i.problemas)||0;
  });
  var areaRows=Object.keys(porArea).map(function(nm){
    var d=porArea[nm];
    var media=d.conf.length?Math.round(d.conf.reduce(function(a,b){return a+b;},0)/d.conf.length):0;
    return {nm:nm,media:media,count:d.conf.length,problemas:d.problemas};
  });
  var bars=areaRows.map(function(r){
    var c=r.media>=90?'#2dde86':r.media>=70?'#ffc83d':'#ff5959';
    return '<div class="tv-area-row"><div class="tv-area-line"><b>'+esc(r.nm)+'</b><strong>'+r.media+'%</strong></div><div class="tv-bar"><span style="width:'+r.media+'%;background:'+c+'"></span></div><small>'+r.count+' inspeção(ões) · '+r.problemas+' não conformidade(s)</small></div>';
  }).join('');

  // Status das inspeções calculado exclusivamente sobre as inspeções realizadas.
  // Conforme = inspeção com conformidade >= 90%. Não conforme = inspeção abaixo de 90%.
  // Pendências e ações em andamento são exibidas como informações complementares e não
  // participam das fatias do gráfico, evitando classificar uma inspeção como pendência.
  var statusCounts={conforme:0,nao:0,pendencia:abertas,andamento:andamento};
  state.inspecoes.forEach(function(i){
    if((Number(i.conformidade)||0)>=90) statusCounts.conforme++;
    else statusCounts.nao++;
  });
  function pct(n){return total?Math.round(n/total*1000)/10:0;}
  var p1=pct(statusCounts.conforme), p2=pct(statusCounts.nao), p3=0, p4=0;
  if(!total){p1=p2=p3=p4=0;}

  var pendList=state.pendencias.filter(function(p){return p.status==='aberto'||p.status==='andamento';}).slice(0,6);
  var pendRows=pendList.map(function(p){
    var st=p.status==='andamento'?'Em andamento':'Em aberto';
    var cls=p.status==='andamento'?'tv-badge-warn':'tv-badge-bad';
    return '<div class="tv-pend-row"><div><b>'+esc(p.titulo||'Pendência')+'</b><small>'+esc((p.areaNome||'—')+' · '+(p.unidadeNome||'—'))+'</small></div><span class="'+cls+'">'+st+'</span></div>';
  }).join('') || '<div class="tv-empty">Nenhuma pendência em aberto.</div>';

  return '<div class="tv-shell">'+
    '<div class="tv-header"><div class="tv-brand"><img src="'+LOGO_SRC+'" alt="FS"><div><h1>MODO APRESENTAÇÃO</h1><p>Manutenção · Visão em tempo real</p></div></div>'+ 
    '<div class="tv-header-right"><div class="tv-clock"><b id="tvDate">--/--/----</b><span id="tvClock">--:--:--</span></div><button class="tv-btn" id="tvFullscreen">⛶ Tela cheia</button><button class="tv-btn tv-exit" id="tvExit">✕ Sair</button></div></div>'+ 
    '<div class="tv-kpis">'+
      '<div class="tv-kpi green"><div class="tv-kicon">📋</div><div><span>INSPEÇÕES</span><b>'+total+'</b><small>Realizadas</small></div></div>'+ 
      '<div class="tv-kpi cyan"><div class="tv-ring" style="--p:'+mediaConf+'"><b>'+mediaConf+'%</b></div><div><span>CONFORMIDADE</span><small>Meta 90%</small></div></div>'+ 
      '<div class="tv-kpi red"><div class="tv-kicon">⚠</div><div><span>NÃO CONFORMES</span><b>'+naoConformes+'</b><small>Abaixo de 90%</small></div></div>'+ 
      '<div class="tv-kpi blue"><div class="tv-kicon">🔧</div><div><span>PENDÊNCIAS</span><b>'+totalPend+'</b><small>'+abertas+' abertas · '+andamento+' andamento</small></div></div>'+ 
      '<div class="tv-kpi purple"><div class="tv-kicon">⚙</div><div><span>EQUIPAMENTOS</span><b>'+totalEquip+'</b><small>Cadastrados</small></div></div>'+ 
    '</div>'+ 
    '<div class="tv-main-grid">'+
      '<section class="tv-panel"><div class="tv-panel-head"><h2>Conformidade por área</h2><span>Atualização automática</span></div><div class="tv-areas">'+(bars||'<div class="tv-empty">Sem inspeções registradas.</div>')+'</div></section>'+ 
    '</div>'+ 
    '<section class="tv-panel tv-pend"><div class="tv-panel-head"><h2>Pendências que exigem atenção</h2><span>'+totalPend+' ativa(s)</span></div><div class="tv-pend-list">'+pendRows+'</div></section>'+ 
    '<div class="tv-footer"><span>● Firebase online · atualização em tempo real</span><b>FS Manutenção</b></div>'+ 
  '</div>';
}

// ================= PENDENCIAS =================
function renderPendencias(){
  var cols=[{id:'aberto',label:'Em aberto',color:'var(--bad)'},{id:'andamento',label:'Em andamento',color:'var(--warn)'},{id:'concluida',label:'Concluída',color:'var(--ok)'},{id:'cancelada',label:'Cancelada',color:'var(--muted)'}];

  return topbar('Pendências','Acompanhamento das ações geradas pelas inspeções',false)+'<div class="page"><div class="pend-kpis"><div class="stat-card"><div class="num">'+state.pendencias.length+'</div><div class="lbl">Total</div></div><div class="stat-card"><div class="num">'+counts.aberto+'</div><div class="lbl">Em aberto</div></div><div class="stat-card"><div class="num">'+counts.andamento+'</div><div class="lbl">Em andamento</div></div><div class="stat-card"><div class="num">'+counts.concluida+'</div><div class="lbl">Concluídas</div></div></div><div class="kanban-board">'+body+'</div></div><button class="fab" id="btnNovaPend">+</button>';
}

// ================= CHAMADOS =================
var PRIO_LABEL = {baixo:'Baixo', medio:'Médio', critico:'Crítico'};
var PRIO_BADGE = {baixo:'badge-ok', medio:'badge-warn', critico:'badge-bad'};
var CHAM_STATUS_LABEL = {andamento:'Em andamento', aguardando:'Aguardando atuação', concluido:'Concluído'};
var CHAM_STATUS_COLOR = {andamento:'var(--warn)', aguardando:'var(--bad)', concluido:'var(--ok)'};

function renderChamadosRoute(){
  var list = state.chamados.slice().sort(function(a,b){ return new Date(b.criadoEm) - new Date(a.criadoEm); });
  if(state.chamadoFiltro !== 'todos'){
    list = list.filter(function(c){ return c.status === state.chamadoFiltro; });
  }

  var filtros = [
    {id:'todos', label:'Todos'},
    {id:'andamento', label:'Em andamento'},
    {id:'aguardando', label:'Aguardando atuação'},
    {id:'concluido', label:'Concluído'},
  ];
  var pills = filtros.map(function(f){
    return '<div class="pill '+(state.chamadoFiltro===f.id?'active':'')+'" data-chamfiltro="'+f.id+'">'+f.label+'</div>';
  }).join('');

  var items = list.map(function(c){
    var statusOpts = ['andamento','aguardando','concluido'].map(function(s){
      return '<option value="'+s+'" '+(c.status===s?'selected':'')+'>'+CHAM_STATUS_LABEL[s]+'</option>';
    }).join('');
    return '<div class="chamado-card">'+
      '<div class="chamado-top">'+
        '<div class="chamado-num">Chamado #'+esc(c.numero)+'</div>'+
        '<span class="badge '+PRIO_BADGE[c.prioridade]+'">'+PRIO_LABEL[c.prioridade]+'</span>'+
      '</div>'+
      '<div class="chamado-meta">'+esc(c.setor)+' · '+fmtDateOnly(c.data)+'</div>'+
      '<div class="chamado-status-row">'+
        '<span class="status-dot" style="background:'+CHAM_STATUS_COLOR[c.status]+';"></span>'+
        '<select class="chamado-status-select" data-chamado="'+c.id+'">'+statusOpts+'</select>'+
        '<button class="chamado-del" data-chamdel="'+c.id+'" title="Excluir">🗑</button>'+
      '</div>'+
    '</div>';
  }).join('');

  var body = list.length ? '<div class="grid-list">'+items+'</div>' :
    '<div class="empty"><div class="ic">🎫</div><p>Nenhum chamado registrado</p><p class="small-muted">Toque em + para abrir um novo chamado</p></div>';

  return topbar('Histórico de Chamados', state.chamados.length+' chamado(s) registrado(s)', false)+
    '<div class="page"><div class="pill-row">'+pills+'</div>'+body+'</div>'+
    '<button class="fab" id="btnNovoChamado">+</button>';
}

function openNovoChamadoSheet(){
  var wrap = document.createElement('div');
  wrap.className='overlay';
  var today = new Date().toISOString().slice(0,10);
  wrap.innerHTML = '<div class="sheet"><div class="sheet-handle"></div>'+
    '<div class="section-title" style="margin-top:0;">Novo Chamado</div>'+
    '<div class="field"><label>Número do chamado</label><input type="text" id="ncNumero" placeholder="Ex: 20456"></div>'+
    '<div class="field"><label>Setor</label><input type="text" id="ncSetor" placeholder="Ex: Manutenção Elétrica"></div>'+
    '<div class="field"><label>Data</label><input type="date" id="ncData" value="'+today+'"></div>'+
    '<div class="field"><label>Prioridade</label><div class="yn-row" id="ncPrioRow">'+
      '<div class="yn-opt yn-sim" data-prio="baixo">Baixo</div>'+
      '<div class="yn-opt yn-nao_possui" data-prio="medio">Médio</div>'+
      '<div class="yn-opt yn-nao" data-prio="critico">Crítico</div>'+
    '</div></div>'+
    '<div class="btn-row"><button class="btn btn-secondary" id="ncCancel">Cancelar</button><button class="btn" id="ncSalvar">Registrar</button></div>'+
    '</div>';
  document.body.appendChild(wrap);

  var selectedPrio = null;
  var selClassOf = {baixo:'sel-sim', medio:'sel-nao_possui', critico:'sel-nao'};
  wrap.querySelectorAll('[data-prio]').forEach(function(el){
    el.addEventListener('click', function(){
      wrap.querySelectorAll('[data-prio]').forEach(function(o){ o.classList.remove('sel-sim','sel-nao','sel-nao_possui'); });
      selectedPrio = el.getAttribute('data-prio');
      el.classList.add(selClassOf[selectedPrio]);
    });
  });
  document.getElementById('ncCancel').addEventListener('click', function(){ wrap.remove(); });
  wrap.addEventListener('click', function(e){ if(e.target===wrap) wrap.remove(); });
  document.getElementById('ncSalvar').addEventListener('click', async function(){
    var numero = document.getElementById('ncNumero').value.trim();
    var setor = document.getElementById('ncSetor').value.trim();
    var data = document.getElementById('ncData').value || today;
    if(!numero){ toast('Informe o número do chamado'); return; }
    if(!setor){ toast('Informe o setor'); return; }
    if(!selectedPrio){ toast('Selecione a prioridade'); return; }
    var c = {
      id: uid(), numero: numero, setor: setor, data: data,
      prioridade: selectedPrio, status: 'andamento', criadoEm: new Date().toISOString(),
    };
    state.chamados.unshift(c);
    await storageSet(STORE_CHAMADOS, state.chamados);
    wrap.remove();
    toast('Chamado registrado');
    state.chamadoFiltro = 'todos';
    render();
  });
}

// ================= EVENT BINDING =================
function bindPageEvents(){
  if(window.__tvClockTimer){ clearInterval(window.__tvClockTimer); window.__tvClockTimer=null; }
  if(state.view==='apresentacao'){
    function updateTvClock(){
      var d=new Date(), de=document.getElementById('tvDate'), ce=document.getElementById('tvClock');
      if(de) de.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
      if(ce) ce.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    updateTvClock();
    window.__tvClockTimer=setInterval(updateTvClock,1000);
    var fs=document.getElementById('tvFullscreen');
    if(fs) fs.addEventListener('click',function(){
      if(!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      else if(document.exitFullscreen) document.exitFullscreen();
    });
    var ex=document.getElementById('tvExit');
    if(ex) ex.addEventListener('click',function(){
      if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
      setView('dashboard');
    });
  }
  var themeToggleBtn = document.getElementById('themeToggle');
  if(themeToggleBtn) themeToggleBtn.addEventListener('click', function(){ toggleTheme(); });

  var backBtn = document.getElementById('btnBack');
  if(backBtn) backBtn.addEventListener('click', function(){
    if(state.view==='checklist'){
      if(state.nav.length===2) state.currentChecklist=null;
      state.nav.pop();
      render();
    } else if(state.view==='equipamentos'){
      // Permite sair do cadastro/edicao sem exigir preenchimento ou salvamento.
      state.editingEquip=null;
      state._equipDraft=null;
      render();
    } else if(state.view==='historico'){
      state.editingInspecaoView=null; render();
    }
  });

  // Checklist navigation
  document.querySelectorAll('[data-area]').forEach(function(el){
    el.addEventListener('click', function(){ state.nav=[el.getAttribute('data-area')]; render(); });
  });
  document.querySelectorAll('[data-unidade]').forEach(function(el){
    el.addEventListener('click', function(){ state.nav=[state.nav[0], el.getAttribute('data-unidade')]; render(); });
  });

  // YN options
  document.querySelectorAll('.yn-opt').forEach(function(el){
    el.addEventListener('click', function(){
      var g=el.getAttribute('data-grupo'), p=el.getAttribute('data-p'), v=el.getAttribute('data-val');
      state.currentChecklist.respostas[g][p].resp = v;
      // update visuals without full rerender
      var row = el.parentElement;
      row.querySelectorAll('.yn-opt').forEach(function(o){ o.className='yn-opt yn-'+o.getAttribute('data-val'); });
      el.classList.add('sel-'+v);
      // Atualiza todos os campos condicionais do mesmo grupo.
      // Isso permite dependencias entre perguntas (ex.: a observacao da pergunta
      // "acao" so aparece quando "funciona" = Nao e "acao" = Nao).
      AREAS.forEach(function(a){
        a.unidades.forEach(function(u){
          u.grupos.forEach(function(gr){
            if(gr.id!==g) return;
            gr.perguntas.forEach(function(pp){
              if(!pp.obsOn) return;
              var w = document.querySelector('[data-obswrap="'+g+'-'+pp.id+'"]');
              if(!w) return;
              var ans = state.currentChecklist.respostas[g] && state.currentChecklist.respostas[g][pp.id];
              var showIt = !!(ans && ans.resp === pp.obsOn);
              if(showIt && pp.obsRequires){
                var reqAns = state.currentChecklist.respostas[g] && state.currentChecklist.respostas[g][pp.obsRequires.id];
                showIt = !!(reqAns && reqAns.resp === pp.obsRequires.resp);
              }
              w.classList.toggle('show', showIt);
            });
          });
        });
      });
      updateHeaderProgress();
    });
  });
  document.querySelectorAll('.obs-answer').forEach(function(el){
    el.addEventListener('input', function(){
      var g=el.getAttribute('data-grupo'), p=el.getAttribute('data-p');
      state.currentChecklist.respostas[g][p].obs = el.value;
    });
  });
  document.querySelectorAll('.txt-answer').forEach(function(el){
    el.addEventListener('input', function(){
      var g=el.getAttribute('data-grupo'), p=el.getAttribute('data-p');
      state.currentChecklist.respostas[g][p].obs = el.value;
      state.currentChecklist.respostas[g][p].resp = 'preenchido';
    });
  });
  var obsGeral = document.getElementById('obsGeral');
  if(obsGeral) obsGeral.addEventListener('input', function(){ state.currentChecklist.inspetorObs = obsGeral.value; });

  var btnSalvar = document.getElementById('btnSalvarInspecao');
  if(btnSalvar) btnSalvar.addEventListener('click', function(){ salvarInspecao(); });

  // Equipamentos
  var equipSearchInput = document.getElementById('equipSearchInput');
  if(equipSearchInput){
    equipSearchInput.addEventListener('input', function(){ state.equipSearch = equipSearchInput.value; render(); setTimeout(function(){ var i=document.getElementById('equipSearchInput'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },0); });
  }
  document.querySelectorAll('[data-equip]').forEach(function(el){
    el.addEventListener('click', function(){ state.editingEquip = el.getAttribute('data-equip'); state._equipDraft=null; render(); });
  });
  var btnNovoEquip = document.getElementById('btnNovoEquip');
  if(btnNovoEquip) btnNovoEquip.addEventListener('click', function(){ state.editingEquip='new'; state._equipDraft=null; render(); });

  var fNome = document.getElementById('fEquipNome');
  if(fNome) fNome.addEventListener('input', function(){ state._equipDraft.nome = fNome.value; });
  var fSerie = document.getElementById('fEquipSerie');
  if(fSerie) fSerie.addEventListener('input', function(){ state._equipDraft.serie = fSerie.value; });
  var fCrit = document.getElementById('fEquipCrit');
  if(fCrit) fCrit.addEventListener('change', function(){ state._equipDraft.criticidade = fCrit.value; });

  var btnAddImg = document.getElementById('btnAddImg');
  var fImgInput = document.getElementById('fEquipImgInput');
  if(btnAddImg && fImgInput){
    btnAddImg.addEventListener('click', function(){ fImgInput.click(); });
    fImgInput.addEventListener('change', function(){
      if(fImgInput.files && fImgInput.files[0]){
        compressImage(fImgInput.files[0], function(dataUrl){
          state._equipDraft.imagens = state._equipDraft.imagens || [];
          if(state._equipDraft.imagens.length<5){ state._equipDraft.imagens.push(dataUrl); render(); }
        });
      }
      fImgInput.value = '';
    });
  }
  document.querySelectorAll('[data-viewimg]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var idx = parseInt(el.getAttribute('data-viewimg'),10);
      var imgs = (state._equipDraft && state._equipDraft.imagens) ? state._equipDraft.imagens : [];
      if(imgs[idx]) openEvidenceViewer(imgs[idx], idx);
    });
  });

  document.querySelectorAll('[data-rmimg]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      var idx = parseInt(el.getAttribute('data-rmimg'),10);
      state._equipDraft.imagens.splice(idx,1);
      render();
    });
  });

  var btnSalvarEquip = document.getElementById('btnSalvarEquip');
  if(btnSalvarEquip) btnSalvarEquip.addEventListener('click', async function(){
    var d = state._equipDraft;
    if(!d.nome || !d.nome.trim()){ toast('Informe o nome do equipamento'); return; }
    var idx = state.equipamentos.findIndex(function(x){return x.id===d.id;});
    if(idx>=0) state.equipamentos[idx]=d; else state.equipamentos.unshift(d);
    await storageSet(STORE_EQUIP, state.equipamentos);
    state.editingEquip=null; state._equipDraft=null;
    toast('Equipamento salvo');
    render();
  });
  var btnExcluirEquip = document.getElementById('btnExcluirEquip');
  if(btnExcluirEquip) btnExcluirEquip.addEventListener('click', async function(){
    if(!confirm('Excluir este equipamento?')) return;
    state.equipamentos = state.equipamentos.filter(function(x){return x.id!==state._equipDraft.id;});
    await storageSet(STORE_EQUIP, state.equipamentos);
    state.editingEquip=null; state._equipDraft=null;
    toast('Equipamento excluído');
    render();
  });

  // Historico
  document.querySelectorAll('[data-filtro]').forEach(function(el){
    el.addEventListener('click', function(){ state.historicoFiltro = el.getAttribute('data-filtro'); render(); });
  });
  document.querySelectorAll('[data-inspecao]').forEach(function(el){
    el.addEventListener('click', function(){ state.editingInspecaoView = el.getAttribute('data-inspecao'); render(); });
  });
  var btnExcluirInsp = document.getElementById('btnExcluirInspecao');
  if(btnExcluirInsp) btnExcluirInsp.addEventListener('click', async function(){
    if(!confirm('Excluir esta inspeção do histórico?')) return;
    state.inspecoes = state.inspecoes.filter(function(x){return x.id!==state.editingInspecaoView;});
    await storageSet(STORE_INSP, state.inspecoes);
    state.editingInspecaoView=null;
    toast('Inspeção excluída');
    render();
  });

  // Pendencias
  document.querySelectorAll('[data-pendstatus]').forEach(function(el){
    el.addEventListener('click', async function(){
      var pid = el.getAttribute('data-pendstatus'), ns = el.getAttribute('data-newstatus');
      var p = state.pendencias.find(function(x){return x.id===pid;});
      if(p){ p.status = ns; await storageSet(STORE_PEND, state.pendencias); render(); }
    });
  });
  var btnNovaPend = document.getElementById('btnNovaPend');
  if(btnNovaPend) btnNovaPend.addEventListener('click', function(){ openNovaPendSheet(); });

  // Chamados
  document.querySelectorAll('[data-chamfiltro]').forEach(function(el){
    el.addEventListener('click', function(){ state.chamadoFiltro = el.getAttribute('data-chamfiltro'); render(); });
  });
  document.querySelectorAll('.chamado-status-select').forEach(function(el){
    el.addEventListener('change', async function(){
      var id = el.getAttribute('data-chamado');
      var c = state.chamados.find(function(x){return x.id===id;});
      if(c){ c.status = el.value; await storageSet(STORE_CHAMADOS, state.chamados); toast('Status atualizado'); render(); }
    });
  });
  document.querySelectorAll('[data-chamdel]').forEach(function(el){
    el.addEventListener('click', async function(){
      if(!confirm('Excluir este chamado?')) return;
      var id = el.getAttribute('data-chamdel');
      state.chamados = state.chamados.filter(function(x){return x.id!==id;});
      await storageSet(STORE_CHAMADOS, state.chamados);
      toast('Chamado excluído');
      render();
    });
  });
  var btnNovoChamado = document.getElementById('btnNovoChamado');
  if(btnNovoChamado) btnNovoChamado.addEventListener('click', function(){ openNovoChamadoSheet(); });
}

function updateHeaderProgress(){
  var area = AREAS.find(function(a){return a.id===state.nav[0];});
  var unidade = area.unidades.find(function(u){return u.id===state.nav[1];});
  var answered=0,total=0;
  unidade.grupos.forEach(function(g){ g.perguntas.forEach(function(p){ total++; if(state.currentChecklist.respostas[g.id][p.id].resp) answered++; }); });
  var sub = document.querySelector('.topbar .sub');
  if(sub) sub.textContent = area.nome+' · '+answered+'/'+total+' respondidas';
}

// ================= NOVA PENDENCIA SHEET =================
function openNovaPendSheet(){
  var wrap = document.createElement('div');
  wrap.className='overlay';
  wrap.innerHTML = '<div class="sheet"><div class="sheet-handle"></div>'+
    '<div class="section-title" style="margin-top:0;">Nova Pendência</div>'+
    '<div class="field"><label>Título</label><input type="text" id="npTitulo" placeholder="Ex: Reparo na cancela"></div>'+
    '<div class="field"><label>Área</label><input type="text" id="npArea" placeholder="Ex: Balanças"></div>'+
    '<div class="field"><label>Local / Unidade</label><input type="text" id="npUnidade" placeholder="Ex: Balança 3"></div>'+
    '<div class="field"><label>Descrição</label><textarea id="npDesc" placeholder="Detalhes da pendência"></textarea></div>'+
    '<div class="btn-row"><button class="btn btn-secondary" id="npCancel">Cancelar</button><button class="btn" id="npSalvar">Criar</button></div>'+
    '</div>';
  document.body.appendChild(wrap);
  document.getElementById('npCancel').addEventListener('click', function(){ wrap.remove(); });
  wrap.addEventListener('click', function(e){ if(e.target===wrap) wrap.remove(); });
  document.getElementById('npSalvar').addEventListener('click', async function(){
    var titulo = document.getElementById('npTitulo').value.trim();
    if(!titulo){ toast('Informe um título'); return; }
    var p = {
      id: uid(),
      titulo: titulo,
      descricao: document.getElementById('npDesc').value.trim(),
      areaNome: document.getElementById('npArea').value.trim() || '—',
      unidadeNome: document.getElementById('npUnidade').value.trim() || '—',
      status: 'aberto',
      origemInspecaoId: null,
      criadoEm: new Date().toISOString(),
    };
    state.pendencias.unshift(p);
    await storageSet(STORE_PEND, state.pendencias);
    wrap.remove();
    toast('Pendência criada');
    render();
  });
}

// ================= INIT =================
(function init(){
  var screen=document.getElementById('authScreen');
  var app=document.getElementById('app');
  var bar=document.getElementById('authTop');
  var message=document.getElementById('authMessage');
  var submit=document.getElementById('authSubmit');
  function showLogin(){
    stopFirebaseListeners();state.loaded=false;
    state.equipamentos=[];state.inspecoes=[];state.pendencias=[];state.chamados=[];
    app.hidden=true;bar.hidden=true;screen.hidden=false;
    document.getElementById('authPassword').value='';
  }
  if(!initFirebase() || !firebase.auth){message.textContent='Falha ao inicializar o Firebase. Verifique a conexão.';return;}
  document.getElementById('authForm').addEventListener('submit',async function(e){
    e.preventDefault();message.textContent='';submit.disabled=true;submit.textContent='Entrando...';
    try{await firebase.auth().signInWithEmailAndPassword(document.getElementById('authEmail').value.trim(),document.getElementById('authPassword').value);}
    catch(err){console.error('Login failed',err);message.textContent='Não foi possível entrar. Verifique e-mail, senha e se a conta está habilitada.';}
    finally{submit.disabled=false;submit.textContent='Entrar no aplicativo';}
  });
  document.getElementById('authLogout').addEventListener('click',function(){firebase.auth().signOut();});
  firebase.auth().onAuthStateChanged(async function(user){
    if(!user){showLogin();return;}
    screen.hidden=true;bar.hidden=false;app.hidden=true;
    document.getElementById('authUser').textContent=user.email||'Usuário autenticado';
    try{
      stopFirebaseListeners();
      await loadAll();
      if(firebase.auth().currentUser!==user)return;
      app.hidden=false;render();message.textContent='';
    }catch(err){
      console.error('Data loading failed',err);
      showLogin();
      message.textContent='Login realizado, mas não foi possível carregar os dados. Confira se as regras do Realtime Database foram publicadas e se este usuário tem acesso. Nenhum dado foi apagado.';
    }
  },function(err){console.error(err);showLogin();message.textContent='Erro de autenticação. Atualize a página e tente novamente.';});
})();
</script>
